name: Build & Test

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build & Test
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
          cache: false

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore WatermarkFairy.sln

      - name: Build
        run: dotnet build WatermarkFairy.sln -c Release --no-restore

      - name: Test
        run: dotnet test WatermarkFairy.sln -c Release --no-build --verbosity normal --logger trx --collect:"XPlat Code Coverage" --results-directory ./coverage

      - name: Coverage summary
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          echo "=== Coverage report ==="
          ls -la coverage/ 2>/dev/null || echo "no coverage dir"
          COVERAGE_FILE=$(find coverage -name "coverage.cobertura.xml" 2>/dev/null | head -1)
          if [ -n "$COVERAGE_FILE" ]; then
            echo "Cobertura: $COVERAGE_FILE"
            grep -oE 'line-rate="[0-9.]+"|branch-rate="[0-9.]+"' "$COVERAGE_FILE" | head -5
          else
            echo "no cobertura.xml found"
          fi

      - name: Publish (single file)
        run: >
          dotnet publish src/WatermarkFairy/WatermarkFairy.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o ./publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WatermarkFairy-win-x64
          path: ./publish/*
          if-no-files-found: error

  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: WatermarkFairy-win-x64
          path: ./publish

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./publish/**
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-') }}
